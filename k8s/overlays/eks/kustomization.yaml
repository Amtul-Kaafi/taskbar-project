# Overlay for EKS:
#   kubectl apply -k k8s/overlays/eks
#
# Same base as local, with the two things that differ in AWS: traffic arrives
# through a load balancer, and the volume is backed by an EBS storage class.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskbar

resources:
  - ../../base

patches:
  - path: service-lb.yaml
    target:
      kind: Service
      name: taskbar
  - path: pvc-gp3.yaml
    target:
      kind: PersistentVolumeClaim
      name: taskbar-data

# CI replaces this tag with the ECR image it just pushed.
images:
  - name: taskbar-app
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/taskbar-app
    newTag: 1.1.0
