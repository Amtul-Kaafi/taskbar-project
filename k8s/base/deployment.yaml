apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskbar
  labels:
    app.kubernetes.io/name: taskbar
spec:
  replicas: 3
  # Keep enough history for `kubectl rollout undo --to-revision=N`.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the requested replica count: add one new pod, wait for
      # it to pass readiness, then retire one old pod.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taskbar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskbar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the mounted volume writable by the unprivileged node user.
        fsGroup: 1000
      terminationGracePeriodSeconds: 20
      containers:
        - name: taskbar
          image: taskbar-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: taskbar-config
          # Readiness gates the rolling update: a new pod only receives traffic
          # once /api/health answers, so a broken image cannot take the app down.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taskbar-data
