# Cluster definition for eksctl:
#   eksctl create cluster -f infra/eks-cluster.yaml
#
# Creates the VPC, a managed node group, the OIDC provider used by IRSA and
# GitHub Actions, and the EBS CSI driver that backs the PersistentVolumeClaim.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: taskbar-eks
  region: ap-south-1
  version: "1.34"
  tags:
    project: taskbar
    managedBy: eksctl

iam:
  # Required for IRSA: service accounts assume IAM roles instead of nodes
  # carrying broad permissions.
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true

managedNodeGroups:
  - name: taskbar-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    privateNetworking: true
    # Spread across AZs so a zone failure cannot take every pod out.
    availabilityZones: ["ap-south-1a", "ap-south-1b"]
    labels:
      role: worker
    tags:
      project: taskbar

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
